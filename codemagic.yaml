workflows:
  android-release:
    name: Android Release (AAB для Google Play)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      android_signing:
        - umnilisenok_keystore
      node: 22
      java: 21
      vars:
        PACKAGE_NAME: "app.lovable.umnilisenok"
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci || npm install
      - name: Build web (Vite)
        script: |
          npm run build
      - name: Add Android platform if missing
        script: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
      - name: Sync Capacitor
        script: |
          npx cap sync android
      - name: Force required permissions in manifest
        script: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          echo "--- Manifest BEFORE ---"
          cat "$MANIFEST"
          if ! grep -q "ACCESS_BACKGROUND_LOCATION" "$MANIFEST"; then
            awk '
              /<manifest[ >]/ && !done {
                print
                print "    <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\" />"
                print "    <uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\" />"
                print "    <uses-permission android:name=\"android.permission.ACCESS_BACKGROUND_LOCATION\" />"
                print "    <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE\" />"
                print "    <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE_LOCATION\" />"
                print "    <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />"
                print "    <uses-permission android:name=\"android.permission.CAMERA\" />"
                print "    <uses-permission android:name=\"android.permission.RECORD_AUDIO\" />"
                done=1
                next
              }
              { print }
            ' "$MANIFEST" > "$MANIFEST.tmp" && mv "$MANIFEST.tmp" "$MANIFEST"
          fi
          echo "--- Manifest AFTER ---"
          cat "$MANIFEST"

      - name: Set versionCode from Codemagic build number
        script: |
          cd android
          sed -i.bak "s/versionCode [0-9]*/versionCode $(($BUILD_NUMBER + 1))/" app/build.gradle
      - name: Configure release signing in build.gradle
        script: |
          GRADLE_FILE="android/app/build.gradle"
          if grep -q "signingConfigs.release" "$GRADLE_FILE"; then
            echo "signingConfigs.release уже настроен — пропускаем"
            exit 0
          fi
          awk '
            /buildTypes[[:space:]]*\{/ && !inserted {
              print "    signingConfigs {"
              print "        release {"
              print "            if (System.getenv()[\"CM_KEYSTORE_PATH\"]) {"
              print "                storeFile file(System.getenv()[\"CM_KEYSTORE_PATH\"])"
              print "                storePassword System.getenv()[\"CM_KEYSTORE_PASSWORD\"]"
              print "                keyAlias System.getenv()[\"CM_KEY_ALIAS\"]"
              print "                keyPassword System.getenv()[\"CM_KEY_PASSWORD\"]"
              print "            }"
              print "        }"
              print "    }"
              inserted = 1
            }
            { print }
          ' "$GRADLE_FILE" > "$GRADLE_FILE.tmp" && mv "$GRADLE_FILE.tmp" "$GRADLE_FILE"
          sed -i.bak '/release {/,/}/ {
            /minifyEnabled/ a\
            signingConfig signingConfigs.release
          }' "$GRADLE_FILE"
          echo "--- build.gradle after patch ---"
          cat "$GRADLE_FILE"
      - name: Build signed AAB
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/mapping.txt

  android-debug:
    name: Android Debug APK (для теста на телефоне)
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      node: 22
      java: 21
    scripts:
      - name: Install npm dependencies
        script: npm ci || npm install
      - name: Build web
        script: npm run build
      - name: Add Android platform if missing
        script: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
      - name: Sync Capacitor
        script: npx cap sync android
      - name: Force required permissions in manifest
        script: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          echo "--- Manifest BEFORE ---"
          cat "$MANIFEST"
          if ! grep -q "ACCESS_BACKGROUND_LOCATION" "$MANIFEST"; then
            awk '
              /<manifest[ >]/ && !done {
                print
                print "    <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\" />"
                print "    <uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\" />"
                print "    <uses-permission android:name=\"android.permission.ACCESS_BACKGROUND_LOCATION\" />"
                print "    <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE\" />"
                print "    <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE_LOCATION\" />"
                print "    <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />"
                print "    <uses-permission android:name=\"android.permission.CAMERA\" />"
                print "    <uses-permission android:name=\"android.permission.RECORD_AUDIO\" />"
                done=1
                next
              }
              { print }
            ' "$MANIFEST" > "$MANIFEST.tmp" && mv "$MANIFEST.tmp" "$MANIFEST"
          fi
          echo "--- Manifest AFTER ---"
          cat "$MANIFEST"

      - name: Build debug APK
        script: |
          cd android
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk
