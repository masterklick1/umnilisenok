workflows:
  android-release:
    name: Android Release (AAB для Google Play)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      android_signing:
        - umnilisenok_keystore
      node: 22
      java: 21
      vars:
        PACKAGE_NAME: "app.lovable.umnilisenok"
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci || npm install
      - name: Build web (Vite)
        script: |
          npm run build
      - name: Add Android platform if missing
        script: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
      - name: Sync Capacitor
        script: |
          npx cap sync android
      - name: Generate app icons & splash screens
        script: |
          # Удаляем стандартные иконки Capacitor, чтобы они не могли попасть в APK.
          find android/app/src/main/res -type f \
            \( -name 'ic_launcher.png' -o -name 'ic_launcher_round.png' \
               -o -name 'ic_launcher_foreground.png' -o -name 'ic_launcher_background.png' \
               -o -name 'ic_launcher.xml' -o -name 'ic_launcher_round.xml' \) -delete
          npx --yes @capacitor/assets@3.0.5 generate --android \
            --assetPath resources \
            --iconBackgroundColor '#FFCD3C' \
            --iconBackgroundColorDark '#231E19' \
            --splashBackgroundColor '#FFCD3C' \
            --splashBackgroundColorDark '#231E19'
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageStat

          required = [
              Path("android/app/src/main/res/mipmap-mdpi/ic_launcher.png"),
              Path("android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png"),
              Path("android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png"),
              Path("android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml"),
              Path("android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml"),
          ]
          missing = [str(path) for path in required if not path.is_file() or path.stat().st_size == 0]
          if missing:
              raise SystemExit("ERROR: Android launcher icons were not generated: " + ", ".join(missing))

          icon = Image.open(required[1]).convert("RGB")
          variation = sum(ImageStat.Stat(icon).var)
          if variation < 1000:
              raise SystemExit("ERROR: Generated launcher icon looks blank or invalid")
          print(f"Verified fox launcher icon: {icon.size[0]}x{icon.size[1]}, variance={variation:.0f}")
          PY

      - name: Configure Android manifest
        script: |
          if [ -z "${GOOGLE_MAPS_ANDROID_KEY:-}" ]; then
            echo "ERROR: Add GOOGLE_MAPS_ANDROID_KEY as a protected Codemagic environment variable."
            exit 1
          fi
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          python3 - "$MANIFEST" <<'PY'
          import os
          import sys
          from xml.sax.saxutils import escape

          manifest_path = sys.argv[1]
          with open(manifest_path, encoding="utf-8") as source:
              manifest = source.read()

          permissions = (
              "ACCESS_FINE_LOCATION",
              "ACCESS_COARSE_LOCATION",
              "ACCESS_BACKGROUND_LOCATION",
              "FOREGROUND_SERVICE",
              "FOREGROUND_SERVICE_LOCATION",
              "POST_NOTIFICATIONS",
              "CAMERA",
              "RECORD_AUDIO",
          )
          missing = [
              f'    <uses-permission android:name="android.permission.{name}" />'
              for name in permissions
              if f'android.permission.{name}' not in manifest
          ]
          if missing:
              application_index = manifest.find("<application")
              if application_index < 0:
                  raise SystemExit("AndroidManifest.xml has no <application> element")
              manifest = manifest[:application_index] + "\n".join(missing) + "\n\n    " + manifest[application_index:]

          metadata_name = "com.google.android.geo.API_KEY"
          if metadata_name not in manifest:
              closing_tag = manifest.find("</application>")
              if closing_tag < 0:
                  raise SystemExit("AndroidManifest.xml has no </application> element")
              api_key = escape(os.environ["GOOGLE_MAPS_ANDROID_KEY"], {'"': '&quot;'})
              metadata = (
                  '        <meta-data\n'
                  '            android:name="com.google.android.geo.API_KEY"\n'
                  f'            android:value="{api_key}" />\n'
              )
              manifest = manifest[:closing_tag] + metadata + manifest[closing_tag:]

          with open(manifest_path, "w", encoding="utf-8") as destination:
              destination.write(manifest)
          PY
          grep -q 'com.google.android.geo.API_KEY' "$MANIFEST"
          echo "Android permissions and Google Maps metadata configured."

      - name: Set versionCode from Codemagic build number
        script: |
          cd android
          sed -i.bak "s/versionCode [0-9]*/versionCode $(($BUILD_NUMBER + 1))/" app/build.gradle
      - name: Configure release signing in build.gradle
        script: |
          GRADLE_FILE="android/app/build.gradle"
          if grep -q "signingConfigs.release" "$GRADLE_FILE"; then
            echo "signingConfigs.release уже настроен — пропускаем"
            exit 0
          fi
          awk '
            /buildTypes[[:space:]]*\{/ && !inserted {
              print "    signingConfigs {"
              print "        release {"
              print "            if (System.getenv()[\"CM_KEYSTORE_PATH\"]) {"
              print "                storeFile file(System.getenv()[\"CM_KEYSTORE_PATH\"])"
              print "                storePassword System.getenv()[\"CM_KEYSTORE_PASSWORD\"]"
              print "                keyAlias System.getenv()[\"CM_KEY_ALIAS\"]"
              print "                keyPassword System.getenv()[\"CM_KEY_PASSWORD\"]"
              print "            }"
              print "        }"
              print "    }"
              inserted = 1
            }
            { print }
          ' "$GRADLE_FILE" > "$GRADLE_FILE.tmp" && mv "$GRADLE_FILE.tmp" "$GRADLE_FILE"
          sed -i.bak '/release {/,/}/ {
            /minifyEnabled/ a\
            signingConfig signingConfigs.release
          }' "$GRADLE_FILE"
          echo "--- build.gradle after patch ---"
          cat "$GRADLE_FILE"
      - name: Build signed AAB
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/mapping.txt

